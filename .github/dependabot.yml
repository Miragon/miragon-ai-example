version: 2

multi-ecosystem-groups:
  backend:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

updates:

  # Backend dependencies and the Postgres image in the dev stack, grouped into one PR
  - package-ecosystem: "gradle"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  - package-ecosystem: "docker-compose"
    directory: "/stack"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  # Frontend (React app + Playwright e2e)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      frontend-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend container image (node build + nginx serve stages)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      frontend-docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      frontend-docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Dev tooling (bpmnlint and its central plugin) — root-level package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      tooling-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      tooling-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
