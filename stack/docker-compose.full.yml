# Full stack in containers: Postgres, the service image and the frontend. Not production-hardened:
# it ships the example jwtSecret and admin/admin credentials from application.yaml.
#
# Build the service image first:  ./gradlew bootBuildImage
# Then:                           docker compose -f stack/docker-compose.full.yml up --build
# Frontend on http://localhost:8090 · service on http://localhost:8081 · Cockpit on :8090/camunda.

name: bikeleasing-full

services:
  postgres:
    image: postgres:18.6
    container_name: bikeleasing-postgres-full
    restart: always
    environment:
      POSTGRES_DB: bikeleasing
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bikeleasing"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-miravelo/cibseven-embedded-example:1.0-SNAPSHOT}
    container_name: bikeleasing-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bikeleasing
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8081:8081"

  frontend:
    build: ../frontend
    container_name: bikeleasing-frontend
    restart: always
    depends_on:
      app:
        condition: service_started
    ports:
      - "8090:80"

volumes:
  pgdata:
