# Serves the built SPA and proxies the same backend paths as the Vite dev proxy to the `app` service,
# so the browser sees one origin and no CORS is involved.

upstream backend {
    server app:8081;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api          { proxy_pass http://backend; }
    location /engine-rest  { proxy_pass http://backend; }
    location /camunda      { proxy_pass http://backend; }
    location /webapp       { proxy_pass http://backend; }
    location /v3/api-docs  { proxy_pass http://backend; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # $http_host keeps the port: the CIB seven webapps build absolute redirects from the Host header.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
